[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "npm run build",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "printf 'upload_max_filesize = 10M\\npost_max_size = 12M\\n' > /tmp/php-uploads.ini && php artisan storage:link --force && PHP_INI_SCAN_DIR=':/tmp' php artisan serve --host=0.0.0.0 --port=8000"
