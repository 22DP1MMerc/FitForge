[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "npm run build",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan storage:link --force && php -d upload_max_filesize=10M -d post_max_size=12M artisan serve --host=0.0.0.0 --port=8000"
